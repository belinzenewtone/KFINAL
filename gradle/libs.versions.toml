[versions]
agp             = "8.8.2"
kotlin          = "2.1.0"
ksp             = "2.1.0-1.0.28"
composeBom      = "2024.12.01"
hilt            = "2.56.1"
room            = "2.6.1"
navigation      = "2.8.5"
datastore       = "1.1.1"
lifecycle       = "2.8.7"
coroutines      = "1.9.0"
workmanager     = "2.9.1"
paging          = "3.3.5"
biometric       = "1.2.0-alpha05"
benchmark       = "1.3.3"
profileinstaller = "1.4.1"
uiautomator     = "2.3.0"
vico            = "1.15.0"
opencsv         = "5.9"
immutable       = "0.3.8"
splashscreen    = "1.0.1"
desugar         = "2.1.4"

[libraries]
# Compose
compose-bom                    = { group = "androidx.compose",      name = "compose-bom",               version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",   name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",   name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui",   name = "ui-tooling" }
compose-ui-test-manifest       = { group = "androidx.compose.ui",   name = "ui-test-manifest" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation              = { group = "androidx.compose.animation", name = "animation" }
compose-foundation             = { group = "androidx.compose.foundation", name = "foundation" }

# AndroidX
activity-compose       = { group = "androidx.activity",  name = "activity-compose",     version = "1.9.3" }
core-ktx               = { group = "androidx.core",      name = "core-ktx",             version = "1.15.0" }
splashscreen           = { group = "androidx.core",      name = "core-splashscreen",    version.ref = "splashscreen" }

# Navigation
navigation-compose     = { group = "androidx.navigation", name = "navigation-compose",  version.ref = "navigation" }

# Hilt
hilt-android           = { group = "com.google.dagger",  name = "hilt-android",         version.ref = "hilt" }
hilt-compiler          = { group = "com.google.dagger",  name = "hilt-android-compiler",version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",     name = "hilt-navigation-compose", version = "1.2.0" }

# Room
room-runtime           = { group = "androidx.room",      name = "room-runtime",         version.ref = "room" }
room-ktx               = { group = "androidx.room",      name = "room-ktx",             version.ref = "room" }
room-compiler          = { group = "androidx.room",      name = "room-compiler",        version.ref = "room" }
room-paging            = { group = "androidx.room",      name = "room-paging",          version.ref = "room" }

# Paging
paging-runtime         = { group = "androidx.paging",    name = "paging-runtime-ktx",   version.ref = "paging" }
paging-compose         = { group = "androidx.paging",    name = "paging-compose",       version.ref = "paging" }

# DataStore
datastore              = { group = "androidx.datastore", name = "datastore-preferences",version.ref = "datastore" }

# Lifecycle / ViewModel
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }
lifecycle-viewmodel-ktx     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",     version.ref = "lifecycle" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }

# Coroutines
coroutines-android     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# WorkManager
workmanager            = { group = "androidx.work",      name = "work-runtime-ktx",     version.ref = "workmanager" }
hilt-work              = { group = "androidx.hilt",      name = "hilt-work",            version = "1.2.0" }
hilt-work-compiler     = { group = "androidx.hilt",      name = "hilt-compiler",        version = "1.2.0" }

# Biometrics
biometric              = { group = "androidx.biometric", name = "biometric-ktx",        version.ref = "biometric" }

# Baseline Profile
benchmark-macro-junit4 = { group = "androidx.benchmark",         name = "benchmark-macro-junit4", version.ref = "benchmark" }
profileinstaller       = { group = "androidx.profileinstaller",  name = "profileinstaller",       version.ref = "profileinstaller" }
uiautomator            = { group = "androidx.test.uiautomator",  name = "uiautomator",            version.ref = "uiautomator" }
test-runner            = { group = "androidx.test",              name = "runner",                 version = "1.6.2" }

# Charts
vico-compose-m3        = { group = "com.patrykandpatrick.vico", name = "compose-m3",   version.ref = "vico" }
vico-compose           = { group = "com.patrykandpatrick.vico", name = "compose",       version.ref = "vico" }

# CSV
opencsv                = { group = "com.opencsv",        name = "opencsv",              version.ref = "opencsv" }

# Immutable collections
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutable" }

# Desugar
desugar                = { group = "com.android.tools",  name = "desugar_jdk_libs",     version.ref = "desugar" }

# Testing
kotlin-test            = { group = "org.jetbrains.kotlin",    name = "kotlin-test",       version.ref = "kotlin" }
kotlin-test-junit      = { group = "org.jetbrains.kotlin",    name = "kotlin-test-junit", version.ref = "kotlin" }
androidx-test-core     = { group = "androidx.test",           name = "core",              version = "1.5.0" }
robolectric            = { group = "org.robolectric",         name = "robolectric",       version = "4.14.1" }
coroutines-test        = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test", version.ref = "coroutines" }
work-testing           = { group = "androidx.work",           name = "work-testing",      version.ref = "workmanager" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
detekt              = { id = "io.gitlab.arturbosch.detekt",         version = "1.23.7" }
ktlint              = { id = "org.jlleitschuh.gradle.ktlint",       version = "12.1.2" }
android-test        = { id = "com.android.test",                    version.ref = "agp" }
baselineprofile     = { id = "androidx.baselineprofile",            version.ref = "agp" }
