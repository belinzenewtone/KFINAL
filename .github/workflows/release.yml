name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + ability to push back the manifest update
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Extract version info
        id: version
        run: |
          echo "name=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
          echo "code=$(grep 'versionCode' app/build.gradle.kts | grep -oP '(?<=versionCode = )\d+')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/lifeos-release.apk

      - name: Compute SHA-256
        id: sha256
        run: |
          HASH=$(sha256sum app/build/outputs/apk/release/lifeos-release.apk | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Update OTA manifest
        run: |
          cat > ota/manifest.json <<MANIFEST
          {
              "version_code":  ${{ steps.version.outputs.code }},
              "version_name":  "${{ steps.version.outputs.name }}",
              "apk_url":  "https://github.com/belinzenewtone/KFINAL/releases/download/v${{ steps.version.outputs.name }}/lifeos-release.apk",
              "apk_sha256":  "${{ steps.sha256.outputs.hash }}",
              "mandatory":  false,
              "title":  "LifeOS ${{ steps.version.outputs.name }}",
              "message":  "A new version of LifeOS is available. Tap Download to get it.",
              "changelog":  "",
              "website_url":  "https://github.com/belinzenewtone/KFINAL/releases"
          }
          MANIFEST
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/manifest.json
          git commit -m "chore: update OTA manifest for v${{ steps.version.outputs.name }}"
          git push origin HEAD:master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LifeOS ${{ steps.version.outputs.name }}
          files: |
            app/build/outputs/apk/release/lifeos-release.apk
          generate_release_notes: true
